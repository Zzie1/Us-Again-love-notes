<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>US 🤍 Again</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9dcc6;--paper:#f4ecdf;--ink:#4e3a2f;--soft:#8a6f5c;--line:#cdb99c;--accent:#9b6b4a;--seal:#d9c6a8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2018;--paper:#3a2c22;--ink:#f1e6d3;--soft:#c2a88c;--line:#5c4638;--accent:#d9a77e;--seal:#4a3a2e}}
:root[data-theme="dark"]{--bg:#2b2018;--paper:#3a2c22;--ink:#f1e6d3;--soft:#c2a88c;--line:#5c4638;--accent:#d9a77e;--seal:#4a3a2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.6;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:34px 26px;box-shadow:0 8px 30px rgba(78,58,47,.14);text-align:center}
h1{font-size:2.5rem;margin:0 0 6px;font-weight:600}
h2{font-size:1.8rem;margin:.2em 0;font-weight:600}
.script{font-family:'Dancing Script',cursive;color:var(--accent);font-size:1.3rem}
.tag{font-style:italic;color:var(--soft);font-size:1.2rem;margin:6px 0 18px}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.small{font-size:.95rem;color:var(--soft)}
button,.btn{font:inherit;background:var(--accent);color:#fff8ee;border:0;border-radius:30px;padding:12px 26px;margin:8px 4px 0;cursor:pointer;font-size:1.05rem}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.entry{text-align:left}
.entry p{margin:0 0 1em;white-space:pre-line}
.entry.poem p{text-align:center;font-style:italic}
.kind{text-transform:uppercase;letter-spacing:.18em;font-size:.8rem;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:18px}
.day{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--seal);color:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:default;padding:0;margin:0}
.day.open{background:var(--paper);color:var(--ink);border-color:var(--accent);cursor:pointer}
.day.today{box-shadow:0 0 0 3px var(--accent)}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.fade{animation:f .8s ease both}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{position:relative;z-index:1}
.entry{position:relative;margin-top:34px}
.entry::before{content:"";position:absolute;inset:8px;border:1px dashed var(--line);border-radius:16px;pointer-events:none}
.seal{width:56px;height:56px;border-radius:50%;background:var(--accent);margin:-62px auto 12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 3px 8px rgba(78,58,47,.3);border:3px solid var(--paper)}
.entry .kind,.entry .script,.entry h2{text-align:center}
.entry:not(.poem) p:first-of-type::first-letter{font-family:'Dancing Script',cursive;font-size:2.8em;float:left;line-height:.85;padding:4px 8px 0 0;color:var(--accent)}
.sign{font-family:'Dancing Script',cursive;color:var(--accent);font-size:1.5rem;text-align:right;margin:10px 0 6px}
.entry.wl p:first-of-type::first-letter{font-family:inherit;font-size:1em;float:none;line-height:inherit;padding:0;color:inherit}
.gal{display:grid;gap:20px;margin:10px 0}
.ph{background:var(--paper);border:1px solid var(--line);padding:10px 10px 14px;box-shadow:0 4px 14px rgba(78,58,47,.18);transform:rotate(-1.2deg)}
.ph:nth-child(even){transform:rotate(1.2deg)}
.ph img,.ph video{width:100%;display:block;border-radius:3px}
.ph p{margin:10px 0 0;font-family:'Dancing Script',cursive;color:var(--accent);text-align:center;font-size:1.2rem}
.fh{position:fixed;bottom:-30px;opacity:0;font-size:16px;pointer-events:none;animation:up linear infinite}
@keyframes up{0%{transform:translateY(0);opacity:0}10%{opacity:.35}90%{opacity:.25}100%{transform:translateY(-110vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.fh{display:none}}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
// ====== CHANGE THIS to the day he gets Day 1 (YYYY-MM-DD) ======
var LAUNCH="2026-11-09";
var TOTAL=7;
// ================================================================
var WELCOME="My love,\n\nSome stories deserve another chapter. I’m not writing this to rewrite the past. I’m writing it because I’m still thinking of you, still choosing you, and still hopeful about who we could become.\n\nEach morning, one little piece of my heart will open for you. Read it slowly.\n\nYours, always";
var E=[
["Congratulations","Day 0 · Congratulations, Ife 🤍","Today is your first official day at work, and I wanted to be the first to say congratulations. 🎉\n\nI know how much this means to you. I’m so proud of you.\n\nStarting afresh after leaving for a while can feel scary and exciting at the same time. Walk in knowing you belong there. You already know the place and a few friendly faces, so you’re not walking in alone. You are intelligent and capable, and they are lucky to have you.\n\nTake it one day at a time. Eat well, rest well, and be kind to yourself.\n\nI’m rooting for you always. Today is all yours.","Proud of you, always. 🤍"],
["Memory","Day 1 · The Boy in Blue Shorts","I remember you in your blue shorts.\n\nWe exchanged greetings, and there was that little excitement that came with discovering we were from the same tribe.\n\nI remember thinking you were different from the people around you. You were composed, well-behaved, articulate, and had this effortless charm about you.\n\nYou spoke so well, carried yourself with a certain grace, and somehow managed to stand out without doing anything extraordinary.\n\nBut here’s the funny part: I didn’t think much of it.\n\nI didn’t go back imagining a future with you. I didn’t picture us having long conversations or becoming important parts of each other’s lives.\n\nYou were simply a charming young man I happened to meet in Numan.\n\nLittle did I know that the same person I barely gave a second thought to would eventually occupy such a special place in my heart.\n\nLife really does have a funny way of introducing us to people, doesn’t it?\n\nIf someone had told me that I would one day be writing you a collection of letters, I probably would have laughed.\n\nYet, here I am, beginning with the boy in blue shorts.","From the girl who had no idea. 🤍"],
["Memory","Day 2 · Somewhere Between Words and Butterflies","I think it started with conversations.\n\nIf I remember correctly, we began talking about writing. You told me about some of your poems, and I remember being drawn to the way your mind worked.\n\nYou were intelligent, articulate, and there was something about your personality that made talking to you feel so easy. We could talk freely, without having to think too hard about what to say next.\n\nAnd then there was the food incident. 😂\n\nI offered you food, but you politely declined, even when I promised to cook for you. Somehow, I eventually shared the rest and left you out of it. You didn’t let me forget it either. You would jokingly bring it up whenever you got the chance.\n\nLittle did you know that you would eventually get more than one opportunity to enjoy my cooking. 😂\n\nBut I think my favourite part was how naturally comfortable we became around each other.\n\nThere was even that moment when I somehow found myself leaning on you. I cannot remember exactly how it happened, but I remember how close we were.\n\nAnd suddenly, there were butterflies in my tummy.\n\nFunny, isn’t it?\n\nI don’t know at what exact point our conversations became something I looked forward to, or when your presence started feeling a little different.\n\nAll I know is that somewhere between your poems, our random conversations, your teasing and those little moments, something began to feel different.\n\nPerhaps that was the beginning of me seeing you as more than just the charming boy in blue shorts.\n\nAnd perhaps, without either of us knowing it, we were already becoming a little story of our own.","From the girl who eventually fed you. 😂🤍"],
["Memory","Day 3 · The Moment I Started Seeing You Differently","Everything happened so quickly.\n\nI remember following you to the ball house, holding your hand, and eventually asking if I could come visit you in your room.\n\nYou told me you were going to be all over me. 😂 And when I came, you certainly weren’t joking.\n\nI think that was when I realised just how smitten you were with me.\n\nAnd honestly, I loved it.\n\nI loved the way you loved me. I loved the affection, the attention and the feeling of being wanted so openly.\n\nYou made me feel special, desired and genuinely wanted. You didn’t make me guess whether you wanted me around.\n\nIt got me thinking...\n\nWhat more was I actually looking for?\n\nHere was someone whose affection I was beginning to enjoy more than I had anticipated.\n\nOf course, things wouldn’t always remain this way. We would eventually have our difficult moments, but I don’t want those moments to erase how beautifully things began.\n\nSomewhere in all of it, I started seeing you differently.\n\nAnd maybe, just maybe, I was becoming just as smitten.","P.S. You really weren’t subtle about liking me. 😂🤍"],
["Appreciation","Day 4 · A Few Things About You 🤍","There are quite a few things I like about you, and I don’t think I tell you enough.\n\nFirst, you’re intelligent. And you never let me forget it, especially when it comes to my grammar. 😂 You always seem to find something to correct, and honestly, I think I’ve accepted that being your favourite grammar student is part of the package.\n\nYou sing beautifully, too. But one thing I particularly love is that bright smile that appears whenever you’re singing. There’s something about seeing you that happy that makes the moment even sweeter.\n\nYou’re caring, sweet, and you’ve got quite the fashion sense. You know how to put yourself together, and I won’t pretend I haven’t noticed. 🤭\n\nAnd then there’s your relationship with sleep. 😂\n\nWhenever you’re getting sleepy, I’ll hear, “Ayo jhoor, let me sleep.” As if I’m deliberately keeping you from your precious sleep!\n\nBut honestly, those little things make you you. And I find them endearing.\n\nI like the intelligent you, the singing you, the fashionable you, the caring you, and even the sleepy you who is always asking me to let him rest.\n\nYou’re quite a character, and I wouldn’t have it any other way. 😂🤍","♡ A little appreciation, just because ♡"],
["Reflection","Day 5 · When You Called Me Home 🤍","I still remember the poem you wrote about me.\n\nMi casa.\n\nYou called me home. You wrote about my smile, my arms bringing you calm, and all those little things about me that you seemed to notice.\n\nIt was such a sweet thing to read.\n\nBut I think I understood those words differently when things between us became difficult.\n\nWe had our disagreements and misunderstandings, yet somehow, we still found ourselves cuddling, sharing what was happening in our lives and enjoying that familiar comfort we had with each other.\n\nI found comfort in knowing that you would always find your way back to me. And we even talked about it.\n\nPerhaps that’s when I began to understand what you meant by home.\n\nNot a perfect relationship, but a familiar place where you could feel comfortable, be yourself and find a little calm.\n\nAnd I hope you know you’ve been that for me too.\n\nMi casa. Your home. 🤎","♡ Some words become more meaningful with time. ♡"],
["Confession","Day 6 · The Morning Cuddles I Miss 🤍","It’s been two weeks since you travelled, and I’m beginning to realise just how much your presence had become part of my everyday life.\n\nPeople keep asking about you, asking if I’m not lonely. I suppose they’re used to seeing us together, because for the longest time, it was almost always you and me.\n\nAnd honestly, I miss you.\n\nI miss those morning cuddles, having you close and all those little moments I probably didn’t realise I would miss this much.\n\nBut something I didn’t expect was how much I’ve come to appreciate the way you express your love for me, even from a distance.\n\nI’m happy we had our difficult moments before you left. As strange as that may sound, I think they helped me prepare for this distance without feeling completely lost in your absence.\n\nI’m grateful for the memories we made, and I’m happy to have experienced those moments with you.","I miss my morning cuddles, though. 😂🤍"],
["Final letter","Day 7 · A Little Hope for Us 🤍","If there’s one thing I want you to take away from these letters, it’s that I truly love you.\n\nI’ve never taken your love for granted, not even for a moment. I know we’ve had our difficult times, and we’ve had moments when figuring things out wasn’t easy, but I don’t want those moments to make you question how much you’ve meant to me.\n\nI genuinely want things to work between us. I want us to grow, understand each other better and hopefully build something beautiful together.\n\nWe’ve been through quite a bit, haven’t we? Even with everything, including Junior. 😂 Who would have thought we’d still be here?\n\nBut honestly, I’m glad we had our moments. I was happy with you. I felt loved, appreciated and wanted. And those feelings are something I’ll always be grateful for.\n\nOf course, I don’t know exactly what the future holds for us. Whatever decisions you make, or whatever we eventually decide together when we see each other, I’ll be okay.\n\nI just hope we give ourselves the chance to see what more we can become.\n\nBecause despite everything, I still see a little hope for us.\n\nAnd perhaps that’s enough for now.","Here’s to us, whatever beautiful thing we become. 🤍"]
];
var PREVIEW=location.hash==="#preview";
var app=document.getElementById("app");
function dayNum(){
 if(PREVIEW)return TOTAL;
 var p=LAUNCH.split("-"),n=new Date();
 var a=Date.UTC(+p[0],p[1]-1,+p[2]),b=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
 return Math.floor((b-a)/864e5);
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function home(){
 var d=dayNum(),btn;
 if(d<0)btn='<p class="script">Tonight, just read the welcome.<br>Tomorrow, your story begins.</p>';
 else btn='<button onclick="go(\'day-'+Math.min(d,TOTAL)+'\')">Open today’s page</button>';
 app.innerHTML='<div class="card fade"><h1>US 🤍 Again ✨🥹</h1><div class="tag">Little pieces of my heart, delivered one at a time</div><hr><h2>Some stories deserve another chapter.</h2><p>And perhaps ours is one of them.</p><p class="small">A collection of 7 days of love, thoughts, confessions and possibilities.</p>'+btn+'<br><button class="ghost" onclick="go(\'welcome\')">Read the welcome</button><button class="ghost" onclick="go(\'diary\')">My diary</button></div>';
}
function welcome(){
 app.innerHTML='<div class="card entry fade wl"><div class="seal">🤍</div><h1 style="text-align:center;font-size:2.1rem">US 🤍 Again ✨🥹</h1><div class="tag" style="text-align:center">7 Days • 7 Letters • Our Story</div><hr><div class="script" style="font-size:1.7rem">Ife,</div><h2 style="font-size:1.5rem">Some stories deserve another chapter.</h2><p>I’m not writing this to rewrite the past. I’m writing it because I’m still thinking of you, still choosing you, and still hopeful about who we could become.</p><p>Each morning, one little piece of my heart will open for you. Take your time with each letter, and read it slowly.</p><div class="sign">Yours, always. 🤍</div><hr><div style="text-align:center"><div class="kind">A little something for you</div><p class="tag">Your first letter awaits...</p><button onclick="openFirst()">OPEN YOUR LETTER ♡</button><p class="small" id="wmsg"></p><p class="small">A seven-day journey of love, memories and us. ♡</p><button class="ghost" onclick="go(\'home\')">Home</button><button class="ghost" onclick="go(\'diary\')">My diary</button></div></div>';
}
function diary(){
 var d=dayNum(),g="";
 for(var i=0;i<=TOTAL;i++){
  var o=i<=d;
  g+='<button class="day'+(o?' open':'')+(i===d?' today':'')+'" '+(o?'onclick="go(\'day-'+i+'\')"':'disabled')+'>'+(o?(i===0?'🎉':i):'🔒')+'</button>';
 }
 app.innerHTML='<div class="card fade"><h2>My diary</h2><p class="small">'+(d<0?'Nothing has opened yet.':(Math.min(d,TOTAL)+1)+' of '+(TOTAL+1)+' pages open.')+' The rest are sealed until their day.</p><div class="grid">'+g+'</div>'+(d>=TOTAL?'<br><button onclick="go(\'memories\')">One last thing 🤍</button>':'')+'<br><button class="ghost" onclick="go(\'home\')">Home</button></div>';
}
function day(n){
 var d=dayNum();
 if(n<0||n>TOTAL||n>d){diary();return}
 var e=E[n],cls=e[0]==="Poem"?" poem":"",t=e[1].split(" · ").slice(1).join(" · ");
 app.innerHTML='<div class="card entry fade'+cls+'"><div class="seal">🤍</div><div class="kind">'+e[0]+'</div><div class="script">'+(n===0?'A special day ✨':'Day '+("0"+n).slice(-2))+'</div><h2>'+esc(t)+'</h2><hr><p>'+esc(e[2])+'</p>'+(e[3]?'<div class="sign">'+esc(e[3])+'</div>':'')+(n===TOTAL?'<div class="script" style="text-align:center">US 🤍 Again</div><hr><div style="text-align:center"><p class="small">One last thing...</p><button onclick="go(\'memories\')">Click to see ✨</button><p class="small">Because some memories deserve to be seen. 🤍</p></div>':'')+'<div class="nav"><button class="ghost" onclick="go(\''+(n>0?'day-'+(n-1):'home')+'\')">'+(n>0?'← Back':'Home')+'</button><button onclick="go(\'diary\')">All pages</button></div></div>';

function go(h){location.hash=h==="home"?"":h;render()}
function render(){
 var h=location.hash.replace("#","");
 window.scrollTo(0,0);
 if(h==="welcome")welcome();
 else if(h==="diary")diary();
 else if(h==="memories")memories();
 else if(h.indexOf("day-")===0)day(parseInt(h.slice(4),10));
